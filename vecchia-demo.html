<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stefano & Friends — Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;font-family:Arial,sans-serif}
#app{height:100vh;display:flex;justify-content:center}
.screen{width:100%;max-width:720px;min-height:100vh;background:#6bb6e8;text-align:center;padding:40px 18px}
h1{font-size:40px;text-shadow:3px 3px #222;margin:35px 0 10px;color:white}
p{font-weight:bold}
button{display:block;width:90%;max-width:500px;margin:18px auto;padding:18px;border:4px solid #111;border-radius:12px;background:#ffd43b;font-size:21px;font-weight:900;box-shadow:5px 5px #111}
button:active{transform:translate(3px,3px);box-shadow:2px 2px #111}
.hidden{display:none!important}
.game{position:relative;height:100vh;overflow:hidden;background:#72c96b}
.road{position:absolute;left:0;right:0;bottom:0;height:42%;background:#555;border-top:8px solid #222}
.road:after{content:'';position:absolute;left:0;right:0;top:50%;border-top:7px dashed white}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5}
.box{background:#111;color:#fff;padding:9px;border:3px solid #fff;border-radius:8px;font-weight:bold}
.player{position:absolute;left:45%;bottom:17%;width:70px;z-index:4}
.head{width:50px;height:50px;border-radius:50%;background:#f0b27a;border:4px solid #111;margin:auto}
.body{height:45px;background:#e53935;border:4px solid #111;border-radius:8px}
.controls{position:absolute;bottom:4%;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:8}
.ctrl{width:100px;margin:0;padding:12px;background:white;font-size:35px}
.obj{position:absolute;width:55px;height:55px;border:4px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
.msg{position:absolute;z-index:10;left:6%;right:6%;top:30%;background:#111;color:white;border:4px solid white;border-radius:14px;padding:18px}
.msg button{width:95%;margin:12px auto;padding:13px;font-size:18px}
</style>
</head>
<body>
<div id="app">
<section id="menu" class="screen">
<h1>STEFANO<br>& FRIENDS</h1>
<p>BOZZA MOBILE v0.1 🎮</p>
<button onclick="startScreen()">▶ INIZIA IL PRIMO GIOCO</button>
<button onclick="alert('IL TOUCH FUNZIONA! 😎')">🧪 TEST PULSANTE</button>
<p>Questo è il test: prima verifichiamo che il gioco sia interattivo sul tuo iPhone.</p>
</section>

<section id="game" class="screen game hidden">
<div class="hud">
<div class="box">⭐ <span id="score">0</span>/5</div>
<div class="box">⏱️ <span id="time">30</span></div>
</div>
<div id="player" class="player"><div class="head"></div><div class="body"></div></div>
<div class="road"></div>
<div id="msg" class="msg">
<h2>MISSIONE 1</h2>
<p>Raccogli 5 oggetti!</p>
<button onclick="play()">VAI!</button>
</div>
<div class="controls">
<button class="ctrl" onclick="move(-1)">◀</button>
<button class="ctrl" onclick="move(1)">▶</button>
</div>
</section>
</div>

<script>
let x=45,score=0,time=30,running=false,timer,items=[];
function startScreen(){
 document.getElementById('menu').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden');
}
function play(){
 running=true;score=0;time=30;
 document.getElementById('score').textContent=0;
 document.getElementById('time').textContent=30;
 document.getElementById('msg').classList.add('hidden');
 spawn();
 clearInterval(timer);
 timer=setInterval(()=>{
   time--;
   document.getElementById('time').textContent=time;
   if(time<=0)finish(false);
 },1000);
}
function spawn(){
 items.forEach(i=>i.remove());items=[];
 ['🚬','🍰','📱','🚬','🍰'].forEach(e=>{
   let o=document.createElement('div');
   o.className='obj';o.textContent=e;
   o.style.left=(8+Math.random()*78)+'%';
   o.style.bottom=(25+Math.random()*48)+'%';
   document.getElementById('game').appendChild(o);
   items.push(o);
 });
 requestAnimationFrame(hit);
}
function hit(){
 if(!running)return;
 let p=document.getElementById('player').getBoundingClientRect();
 items=items.filter(o=>{
   let r=o.getBoundingClientRect();
   let h=!(p.right<r.left||p.left>r.right||p.bottom<r.top||p.top>r.bottom);
   if(h){
     o.remove();score++;
     document.getElementById('score').textContent=score;
     if(score>=5)finish(true);
     return false;
   }
   return true;
 });
 if(running)requestAnimationFrame(hit);
}
function move(d){
 if(!running)return;
 x=Math.max(5,Math.min(88,x+d*7));
 document.getElementById('player').style.left=x+'%';
}
function finish(win){
 running=false;clearInterval(timer);items.forEach(i=>i.remove());
 document.getElementById('msg').innerHTML='<h2>'+ (win?'🏆 VITTORIA!':'💀 TEMPO SCADUTO!')+'</h2><p>'+ (win?'Hai completato la prima missione!':'Riprova!')+'</p><button onclick="play()">RIPROVA</button>';
 document.getElementById('msg').classList.remove('hidden');
}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
});
</script>
</body>
</html>
